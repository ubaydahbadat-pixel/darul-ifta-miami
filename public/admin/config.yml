# Darul Iftāʾ Miami — fatwa submission form (/admin)
# Sign in with a GitHub personal access token. Saving here commits to GitHub; the site updates in ~2 minutes.

backend:
  name: github
  repo: ubaydahbadat-pixel/darul-ifta-miami
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "New {{collection}} entry: {{slug}}"
    update: "Update {{collection}} entry: {{slug}}"
    delete: "Delete {{collection}} entry: {{slug}}"

app_title: Darul Iftāʾ Miami — Submissions
site_url: https://darul-ifta-miami.ubaydahbadat.workers.dev
logo_url: /logo.svg
media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

editor:
  preview: false

collections:
  - name: fatawa
    label: Fatāwā
    label_singular: Fatwa
    folder: src/content/fatawa
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    summary: "{{title}} · {{topic}}"
    sortable_fields: [date, title, category]
    fields:
      # 1. Category — keep this list the same as src/data/categories.ts
      - name: category
        label: Category
        widget: select
        options:
          - { value: taharah, label: "Purification (Ṭahārah)" }
          - { value: salah, label: "Prayer (Ṣalāh)" }
          - { value: sawm, label: "Fasting (Ṣawm)" }
          - { value: zakah, label: "Obligatory Charity (Zakāh)" }
          - { value: hajj-umrah, label: "Pilgrimage (Ḥajj & ʿUmrah)" }
          - { value: udhiyah, label: "Uḍḥiyah/Qurbānī" }
          - { value: muamalat, label: "Business & Finance (Muʿāmalāt)" }
          - { value: nikah, label: "Marriage & Divorce (Nikāḥ & Ṭalāq)" }
          - { value: hazr-ibahah, label: "Permitted & Prohibited (al-Ḥaẓr wa al-Ibāḥah)" }
          - { value: inheritance, label: "Inheritance (Mīrāth)" }
          - { value: miscellaneous, label: "Miscellaneous" }
      # 2. Topic
      - name: topic
        label: Topic
        widget: string
        hint: "Plain English first, the Arabic term in brackets, e.g. Prostration of Forgetfulness (Sajdah al-Sahw). The bracketed term makes the link. Use the exact same wording to file under an existing topic."
      # 3. Title
      - name: title
        label: Title
        widget: string
        hint: "Also becomes the web link. Choose carefully: once published, the link should not change."
      - name: date
        label: Date
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        format: YYYY-MM-DD
      # 4. Question
      - name: question
        label: Question
        widget: text
        hint: "Separate paragraphs with a blank line."
      # 5. Short answer
      - name: short_answer
        label: Short Answer
        widget: text
      # 6. Explanation — numbered sections (nodes)
      - name: explanation
        label: Explanation
        label_singular: Section
        widget: list
        required: false
        summary: "{{fields.heading}}"
        hint: "One section per part of the answer, in order. English only — Arabic texts go in References."
        fields:
          - name: heading
            label: Section heading
            widget: string
          - name: text
            label: Text
            widget: text
            hint: "Separate paragraphs with a blank line. Give classical scholars' death dates on first mention, e.g. Imām al-Qudūrī (d. 428 AH)."
      # 8. Ḥikmah
      - name: hikmah
        label: "Wisdom of the Ruling (Ḥikmah)"
        widget: text
        required: false
      # 9. References
      - name: references
        label: References
        label_singular: Reference
        widget: list
        required: false
        summary: "{{fields.source}}"
        fields:
          - name: source
            label: Source (book, volume:page, edition)
            widget: string
          - name: language
            label: Language
            widget: select
            options: [Arabic, Urdu, Persian, English, German, French]
            default: Arabic
          - name: text
            label: Full text
            widget: text
            hint: "Paste the full passage. Each line shows as its own paragraph; WhatsApp timestamps are removed automatically. Arabic inside an Urdu sentence: put it in [square brackets]. To make a heading bold, put ** on both sides."
      # 10. Publish switch
      - name: draft
        label: "Draft — keep hidden from the website"
        widget: boolean
        default: true
        hint: "Switch off to publish."

  # ── Events ─────────────────────────────────────────────────────
  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    extension: md
    format: frontmatter
    create: true
    slug: "{{date}}-{{title}}"
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - name: title
        label: Event title
        widget: string
      - name: date
        label: Date
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        format: YYYY-MM-DD
        hint: "The day of the event (or its first day). After this date (or the end date) it moves to Completed Events automatically."
      - name: end_date
        label: End date (multi-day events only)
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        format: YYYY-MM-DD
        required: false
      - name: start_time
        label: Start time
        widget: string
        required: false
        hint: "e.g. 6:30 pm"
      - name: end_time
        label: End time
        widget: string
        required: false
      - name: location
        label: Venue
        widget: string
        required: false
        hint: "e.g. Masjid name, or Online"
      - name: address
        label: Address
        widget: string
        required: false
        hint: "Shown with a link to directions."
      - name: summary
        label: One-line summary
        widget: string
        required: false
        hint: "Shown in the event lists."
      - name: description
        label: Details
        widget: text
        required: false
        hint: "Separate paragraphs with a blank line."
      - name: registration_url
        label: Registration or sign-up link
        widget: string
        required: false
      - name: image
        label: Poster or image
        widget: image
        required: false
      - name: recap
        label: After the event (recap)
        widget: text
        required: false
        hint: "Optional. Shown on the event's page once it is completed, e.g. a short summary or attendance."
      - name: draft
        label: "Draft — keep hidden from the website"
        widget: boolean
        default: true
        hint: "Switch off to publish."

  # ── Madhhab section ────────────────────────────────────────────
  # Scholars, Books and Places feed the Madhhab pages and both interactive maps.
  - name: scholars
    label: "Madhhab: Scholars"
    label_singular: Scholar
    folder: src/content/scholars
    extension: md
    format: frontmatter
    create: true
    slug: "{{short_name}}"
    identifier_field: name
    summary: "{{name}} · d. {{death_ah}}"
    sortable_fields: [name, death_ah]
    fields:
      - name: name
        label: Name
        widget: string
        hint: "Full name, including lineage, with diacritics."
      - name: short_name
        label: Short name
        widget: string
        hint: "How the scholar is usually known, e.g. al-Qudūrī. Used on the maps and in the web link, so choose carefully: once published, the link should not change."
      - name: tabaqah
        label: Ṭabaqah
        widget: select
        required: false
        options:
          - Ṣaḥābah
          - Tābiʿūn
          - Imāms of Fiqh
          - Ṭabaqah 1
          - Ṭabaqah 2
          - Ṭabaqah 3
          - Ṭabaqah 4
          - Ṭabaqah 5
          - Ṭabaqah 6
          - Ṭabaqah 7
          - Ṭabaqah 8
          - Ṭabaqah 9
          - Ṭabaqah 10
        hint: "The group the scholar is listed under on the Scholars page. Leave empty and they show under \"Not yet placed\"."
      - name: order
        label: Position in group
        widget: number
        value_type: int
        required: false
        hint: "Optional. Lower numbers come first within the group (e.g. 10, 20, 30, leaving gaps to insert others later). Without a number, scholars follow in order of death."
      - name: biography
        label: Biography
        widget: text
        required: false
        hint: "Opens when a reader clicks the scholar's name. Separate paragraphs with a blank line. English for the general reader; Arabic quotations can go in their own paragraph."
      - name: biography_source
        label: Source of the biography
        widget: string
        required: false
        hint: "e.g. al-Naqīb, al-Madhhab al-Ḥanafī, p. 65."
      - name: biography_checked
        label: "Biography checked — show it on the site"
        widget: boolean
        default: false
        hint: "Biographies drafted by Claude stay hidden until this is ticked."
      - name: death_ah
        label: Date of death (AH)
        widget: number
        value_type: int
        required: false
        hint: "Year only, e.g. 428. Leave empty if unknown."
      - name: death_approximate
        label: Date of death is approximate
        widget: boolean
        default: false
        hint: "Shows as \"c. 428 AH\"."
      - name: places
        label: Location
        widget: relation
        collection: places
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: "Where they lived or taught. Put the main place first: it is the one used for the teacher–student lines on the map. Missing place? Add it under Madhhab: Places first."
      - name: chains
        label: Chain
        widget: relation
        collection: chains
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        multiple: true
        required: false
        hint: "The regional chain(s) the scholar belongs to, e.g. Balkh. A scholar can be in more than one. Missing chain? Add it under Madhhab: Chains first."
      - name: teachers
        label: Teachers
        widget: relation
        collection: scholars
        value_field: "{{slug}}"
        search_fields: [name, short_name]
        display_fields: [short_name]
        multiple: true
        required: false
        hint: "Only scholars already entered appear here. A link entered on either side shows on both pages, so you only need to enter it once."
      - name: students
        label: Students
        widget: relation
        collection: scholars
        value_field: "{{slug}}"
        search_fields: [name, short_name]
        display_fields: [short_name]
        multiple: true
        required: false
      - name: draft
        label: "Draft — keep hidden from the website"
        widget: boolean
        default: true
        hint: "Books written are listed automatically from the Books entries."

  - name: books
    label: "Madhhab: Books"
    label_singular: Book
    folder: src/content/books
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title]
    fields:
      - name: title
        label: Book title
        widget: string
        hint: "Also becomes the web link. Choose carefully: once published, the link should not change."
      - name: author
        label: Author
        widget: relation
        collection: scholars
        value_field: "{{slug}}"
        search_fields: [name, short_name]
        display_fields: [short_name]
        required: false
        hint: "Enter the author under Madhhab: Scholars first. The author's date of death is taken from there."
      - name: work_type
        label: Type of work
        widget: select
        required: false
        options:
          - "Original work"
          - "Commentary (Sharḥ)"
          - "Abridgement (Mukhtaṣar)"
          - "Gloss (Ḥāshiyah)"
          - "Other"
      - name: based_on
        label: Based on
        widget: relation
        collection: books
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "For a commentary, abridgement or gloss: the book it is written on. It will be listed on that book's page, grouped by type. Enter the base book first."
      - name: recension_by
        label: Recension (riwāyah) of
        widget: relation
        collection: scholars
        value_field: "{{slug}}"
        search_fields: [name, short_name]
        display_fields: [short_name]
        multiple: true
        required: false
        hint: "If this entry is a particular recension of the book, the scholar(s) it is transmitted through, e.g. al-Aṣl in the recension of Abū Sulaymān al-Jūzjānī."
      - name: place
        label: Location
        widget: relation
        collection: places
        value_field: "{{slug}}"
        search_fields: [name]
        display_fields: [name]
        required: false
        hint: "Where the book is from. Leave empty to use the author's main place."
      - name: content
        label: Book's content
        widget: text
        required: false
        hint: "What the book covers. Separate paragraphs with a blank line."
      - name: fiqh_points
        label: Points of fiqh from the book
        label_singular: Point
        widget: list
        required: false
        field: { name: point, label: Point, widget: text }
        hint: "One or two points."
      - name: influenced_by
        label: Influenced by
        widget: relation
        collection: books
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Earlier books this book draws on, e.g. the matn a sharḥ comments on. A link entered on either side shows on both pages."
      - name: influenced
        label: Influenced
        widget: relation
        collection: books
        value_field: "{{slug}}"
        search_fields: [title]
        display_fields: [title]
        multiple: true
        required: false
        hint: "Later books influenced by this one."
      - name: draft
        label: "Draft — keep hidden from the website"
        widget: boolean
        default: true

  - name: chains
    label: "Madhhab: Chains"
    label_singular: Chain
    folder: src/content/chains
    extension: json
    format: json
    create: true
    slug: "{{name}}"
    identifier_field: name
    summary: "{{name}}"
    fields:
      - name: name
        label: Chain name
        widget: string
        hint: "e.g. Kufa, Baghdad, Egypt, Bukhārā, Samarqand, Balkh, Subcontinent."
      - name: colour
        label: Colour on the maps
        widget: color
      - name: order
        label: Position in the list
        widget: number
        value_type: int
        required: false
        hint: "Optional. Lower numbers come first in the chain menu."

  - name: places
    label: "Madhhab: Places"
    label_singular: Place
    folder: src/content/places
    extension: json
    format: json
    create: true
    slug: "{{name}}"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [name]
    fields:
      - name: name
        label: Place name
        widget: string
      - name: latitude
        label: Latitude
        widget: number
        value_type: float
        hint: "In Google Maps, right-click the place and click the numbers at the top to copy them, e.g. 32.0257, 44.4026. The first number is the latitude."
      - name: longitude
        label: Longitude
        widget: number
        value_type: float
        hint: "The second number."

  # Ask page settings (one small file, not a fatwa)
  - name: settings
    label: Ask Page Settings
    files:
      - name: ask
        label: Ask page
        file: src/data/ask-settings.json
        format: json
        fields:
          - name: askTurnaround
            label: Turnaround time
            widget: string
            required: false
            hint: 'Shown on the Ask page as "Most questions are answered within …". Write e.g. "7 working days". Leave empty to hide the line.'
